function buildBlueprintSummary(blueprint, simTime, objectStates) {
  if (!blueprint) return 'No simulation loaded.';
  const lines = [
    `Problem: ${blueprint.description}`,
    `Type: ${blueprint.problem_type}`,
    `Time elapsed: ${simTime.toFixed(2)} s`,
  ];
  blueprint.objects.forEach(obj => {
    const st = objectStates[obj.id];
    lines.push(`Object "${obj.label}" (${obj.mass} kg): pos=(${st ? st.position.x.toFixed(2) : obj.position.x}, ${st ? st.position.y.toFixed(2) : obj.position.y}) m, speed=${st ? st.speed.toFixed(2) : 0} m/s`);
  });
  blueprint.forces.forEach(f => lines.push(`Force ${f.label}: ${f.magnitude?.toFixed(2)} N at ${f.angle_degrees} deg`));
  if (blueprint.known_results?.acceleration != null) lines.push(`Expected acceleration: ${blueprint.known_results.acceleration} m/s2`);
  return lines.join('\n');
}

function formatContent(text) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith('**') && part.endsWith('**')) {
      return <span key={i} className="force-highlight">{part.slice(2, -2)}</span>;
    }
    return part;
  });
}

      </div>
      {tutorHistory.length === 0 && blueprint && (
        <div className="starters">
          {(STARTER_QUESTIONS[blueprint.problem_type] || STARTER_QUESTIONS.default).map(q => (
            <button key={q} className="starter-btn" onClick={() => sendMessage(q)}>{q}</button>
          ))}
        </div>
      )}
      <div className="tutor-input-area">
        <textarea ref={inputRef} className="tutor-input" value={input}
          onChange={e => setInput(e.target.value)} onKeyDown={onKeyDown}
          placeholder={blueprint ? 'Ask about forces, motion, energy...' : 'Load a problem first'}
          disabled={!blueprint || !geminiApiKey || tutorLoading} rows={2} />
        <button className="send-btn" onClick={() => sendMessage(input)} disabled={!input.trim() || !blueprint || !geminiApiKey || tutorLoading}>
          &#8593;
        </button>
      </div>
    </div>
  );
}

/* ================================================================
   APP ROOT
================================================================ */
function KeyboardHints() {
  return (
    <div style={{ display:'flex', gap:12, marginLeft:'auto', alignItems:'center' }}>
      {[['Space','Play/Pause'],['R','Reset'],['ArrowR','Step frame'],['Scroll','Zoom']].map(([key, label]) => (
        <span key={key} style={{ fontSize:11, color:'#8888aa', display:'flex', alignItems:'center', gap:4 }}>
          <kbd style={{ background:'#1a1a3a', border:'1px solid #252545', borderRadius:4, padding:'1px 5px', fontFamily:'monospace', fontSize:11, color:'#ccc' }}>{key}</kbd>
          {label}
        </span>
      ))}
    </div>
  );
}

function App() {
  const { play, pause, reset, stepFrame } = useSimulation();
  const simState = useStore(s => s.simState);
  const onKey = useCallback((e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === ' ') { e.preventDefault(); simState === 'running' ? pause() : play(); }
    if (e.key === 'r' || e.key === 'R') reset();
    if (e.key === 'ArrowRight') stepFrame();
  }, [simState, play, pause, reset, stepFrame]);
  useEffect(() => { window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, [onKey]);

  return (
    <SimulationContext.Provider value={{ play, pause, reset, stepFrame }}>
      <div className="app">
        <header className="app-header">
          <div className="app-logo">Physics<span>Sim</span></div>
          <div className="app-subtitle">AI-Powered 3D Physics Laboratory</div>
          <KeyboardHints />
        </header>
        <div className="app-body">
          <aside className="left-panel"><ImageUpload /></aside>
          <main className="canvas-wrapper"><PhysicsCanvas3D /></main>
          <aside className="right-panel"><SocraticPanel /></aside>
        </div>
        <footer className="bottom-bar">
          <TimeControls />
          <div style={{ width:1, background:'#252545', alignSelf:'stretch', margin:'6px 0' }} />
          <VectorControls />
        </footer>
        <MissingDataModal />
      </div>
    </SimulationContext.Provider>
  );
}

/* ================================================================
   MOUNT
================================================================ */
createRoot(document.getElementById('root')).render(
  <React.StrictMode><App /></React.StrictMode>
);
</script>
</body>
</html>
